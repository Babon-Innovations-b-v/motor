[project]
name = "motor"
version = "0.1.0"
description = "MOTOR: one standardised solver between physical AI and biomechanics, on the GPU."
readme = "README.md"
license = "MIT"
# The Python of the newton image SCORE runs the sim body in (3.12).
requires-python = ">=3.12,<3.13"
# The sim body's pins, exactly as SCORE's newton image and newton_env.sh hold them on 2026-11-08: newton 1.7.0 with
# mujoco-warp 3.15.0 is the first set that builds deterministic mode. A pin changes here and in those images together.
dependencies = [
    "newton==1.7.0",
    "mujoco==3.15.0",
    "mujoco-warp==3.15.0",
    "warp-lang==1.18.0",
    "usd-core==26.8",
    "newton-usd-schemas==0.5.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "python-fcl==0.7.0.11",
    "mink==1.3.0",
    "qpsolvers==4.13.0",
    "daqp==0.10.3",
    "typing_extensions==4.16.0",
]

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
